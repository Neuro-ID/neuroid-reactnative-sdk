plugins { 
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}

if (project != rootProject) {
  apply plugin: 'com.facebook.react'
}

def isNewArchitectureEnabled() {
  return project.hasProperty("newArchEnabled") &&
    project.newArchEnabled.toString() == "true"
}

android {
  namespace 'com.neuroidreactnativesdk'
  compileSdkVersion 36
  
  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 34
    buildConfigField 'boolean', 'IS_NEW_ARCHITECTURE_ENABLED', isNewArchitectureEnabled().toString()
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += ['src/newarch/java']
      } else {
        java.srcDirs += ['src/oldarch/java']
      }
    }
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable 'GradleCompatible'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
    freeCompilerArgs += ["-Xskip-metadata-version-check"]
  }
}

repositories {
  mavenCentral()
  google()
  maven { url 'https://jitpack.io' }
  maven { url 'https://maven.fpregistry.io/releases' }
}

dependencies {
  implementation 'com.facebook.react:react-android:+'
  implementation 'androidx.core:core-ktx:1.8.0'
  implementation 'com.github.neuro-id.neuroid-android-sdk:react-android-sdk:eng-12370~update-deps-SNAPSHOT'
  implementation 'com.google.code.gson:gson:2.10.1'
  implementation("androidx.lifecycle:lifecycle-process:2.3.0")
  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2")
}
